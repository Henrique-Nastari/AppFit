name: mobile
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3
  firebase_storage: ^13.0.3
  google_sign_in: 6.3.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  google_fonts: ^6.2.1
  share_plus: ^12.0.1
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  vibration: ^3.1.4
  flutter_local_notifications: ^19.5.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # ADICIONADO: Pacote para gerar ícones
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

# --- CONFIGURAÇÃO DO ÍCONE ---
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 21